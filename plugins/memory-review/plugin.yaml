name: memory-review
version: 0.4.0
description: "LLM gate for memory() writes: every write is reviewed by a stateless API call against a model already configured in Hermes (three states: approve / reject with reason / defer). Fail open on any reviewer failure. Quality filter, not a security boundary."
author: "Loo1015"
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - pre_llm_call
provides_commands:
  - memory-review
